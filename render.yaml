# Single Django app: API + React UI (one Render Web Service)
services:
  - type: web
    name: righand
    runtime: python
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm install &&
      npm run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT righand.wsgi:application
    healthCheckPath: /health
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: REACT_APP_API_URL
        value: /api
      - key: PYTHON_VERSION
        value: "3.11.9"
