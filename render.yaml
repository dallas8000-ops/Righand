# LEGACY — Render blueprint only. Production deploys on Railway via railway.toml + Dockerfile.
# See backend/RAILWAY_DEPLOY.md
#
# Single Django app: API + React UI (Railway/Render compatible)
services:
  - type: web
    name: righand
    runtime: python
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm install &&
      npm run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT righand.wsgi:application
    healthCheckPath: /health
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: REACT_APP_API_URL
        value: /api
      - key: RIGHAND_FRONTEND_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: righand-production.up.railway.app,righand-frontend-production.up.railway.app,.railway.app,righand.gilliomfrontlinedigital.com,righand.onrender.com,.onrender.com,localhost,127.0.0.1
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Stripe: set values in Render dashboard (see docs/STRIPE_RENDER_SETUP.md). Verify: GET /health/billing
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_FLEET
        sync: false
      - key: STRIPE_CHECKOUT_DISPLAY_NAME
        sync: false
